name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile every module
        run: python -m compileall -q rogerloop tests examples
      - name: unit suite
        run: python -m unittest discover -s tests -v
      - name: engine selftest
        run: python -m rogerloop --selftest
